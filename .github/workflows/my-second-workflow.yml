name: my-second-workflow
# To get a trigger on every push in this repo in any branch
on:
  push:

jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step 2 - Checkout
        uses: actions/checkout@v7.0.1
      - name: Step 3
        run: |
          echo `pwd` >> myartifact.txt
          ls -ltr
          hostname
      - name: Step 4 - Upload Single file
        uses: actions/upload-artifacts@7.0.1
        with:
          name: single_file
          path: ./myartifact.txt
