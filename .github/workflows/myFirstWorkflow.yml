name: my-first-workflow
# To get a trigger on every push in this repo on any branch
on: 
  schedule:
    - cron: "1 * 1 * *"
  workflow_dispatch:
  
jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest
    steps:
      - name: Running a single command in Job1
        run: echo "Hi, this is my first GitHub workflow"
      - name: Checking OS release for GitHub Hosted Runner
        run: cat /etc/os-release
      - name: Calling Sleep
        run: sleep 20

  job2:
    name: job2
    runs-on: ubuntu-latest
    steps:
      - name: Checking the hostname for Runner
        run: hostname
      - name: Running multiple commands
        run: |
          echo "Hi from M. Charles"
          echo "Current time is `date`"
          sleep 20

  job3:
    name: job3
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Job with Single dependency
        run: sleep 20

  job4:
    name: job4
    runs-on: ubuntu-latest
    needs: [ job2, job3]
    steps:
      - name: Job with multiple dependencies
        run: sleep 10
